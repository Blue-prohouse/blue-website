<body data-page="portfolio.html">
<div id="slot-header"></div>

<section class="phead"><div class="wrap">
  <div class="crumbs"><a href="index.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a><span>/</span>
    <em style="font-style:normal" data-ar="الأعمال" data-en="Work">الأعمال</em></div>
  <p class="eyebrow" data-ar="أعمال مختارة" data-en="Selected Works">أعمال مختارة</p>
  <h1 class="display h1" data-ar="أعمالنا" data-en="OUR WORK">أعمالنا</h1>
  <p class="lead" data-ar="أكثر من 100 مشروع منذ 2014 بين الأفلام والإعلانات التجارية والدراما والكليبات والبرامج التلفزيونية والموشن جرافيك."
     data-en="Over 100 projects since 2014 across film, commercials, drama, music clips, TV programs and motion graphics.">
    أكثر من 100 مشروع منذ 2014 بين الأفلام والإعلانات التجارية والدراما والكليبات والبرامج التلفزيونية والموشن جرافيك.</p>
</div></section>

<section style="padding-bottom:clamp(70px,10vw,130px)"><div class="wrap">
  <div class="filters rev" data-filters="#mosaic" style="margin-bottom:38px"></div>
  <div class="mosaic" id="mosaic"></div>
  <div class="rev" style="margin-top:48px;text-align:center">
    <button class="btn" id="more" data-ar="عرض المزيد" data-en="Load more">عرض المزيد</button>
    <p class="muted" style="margin-top:16px;font-size:12.5px"
       data-ar="— النموذج يعرض 8 مشاريع، والموقع الحقيقي سيعرض الـ26 كلها من قاعدة البيانات"
       data-en="— The mockup shows 8 projects; the live site will show all 26 from the database">
      — النموذج يعرض 8 مشاريع، والموقع الحقيقي سيعرض الـ26 كلها من قاعدة البيانات</p>
  </div>
</div></section>

<div data-slot="marquee"></div>
<div data-slot="cta"></div>
<div id="slot-footer"></div>

<script src="assets/site.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const sizes=['s-lg','s-md','s-wd','s-wd','s-md','s-md','s-wd','s-wd'];
  document.getElementById('mosaic').innerHTML =
    PROJECTS.map((p,i)=>tile(p,sizes[i%sizes.length])).join('');
  document.getElementById('more').onclick=e=>{
    e.target.textContent = document.documentElement.lang==='ar' ? 'لا توجد مشاريع أخرى' : 'No more projects';
    e.target.disabled=true; e.target.style.opacity=.5;
  };
});
</script>
